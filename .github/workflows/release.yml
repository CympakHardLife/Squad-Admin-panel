name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Run tests
        working-directory: source
        run: go test ./...

      - name: Build SquadAdmin.exe
        working-directory: source
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o ../SquadAdmin.exe .

      - name: Attach executable to release
        uses: softprops/action-gh-release@v2
        with:
          files: SquadAdmin.exe
          draft: false
          generate_release_notes: false
